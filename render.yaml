# Описание сервиса для Render. Лежит в репозитории, чтобы разворачивание
# повторялось один в один и не собиралось кликами в панели заново.
#
# Секреты сюда не пишем: BOT_TOKEN и PAYMENT_DETAILS помечены sync:false —
# Render спросит их при создании сервиса и сохранит у себя.
services:
  - type: web
    name: watch-demo-shop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Порт берётся из PORT, который подставляет платформа.
    startCommand: python -m api
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PAYMENT_DETAILS
        sync: false
      # Бесплатный тариф усыпляет контейнер без входящих запросов — на polling
      # бот в этот момент глохнет, webhook его будит.
      - key: USE_WEBHOOK
        value: "true"
      # За прокси Render: разрешает верить заголовку с реальным IP и слушать
      # 0.0.0.0. Без этого все посетители делят одну корзину лимитов.
      - key: TRUST_PROXY
        value: "true"
      # Сервис будит сам себя раз в 10 минут: без входящих запросов free-тариф
      # засыпает, и первый за вечер покупатель ждёт пробуждения полминуты.
      - key: KEEPALIVE_MINUTES
        value: "10"
      - key: SEED
        value: shop
      - key: CURRENCY
        value: USD
      # Консультант на Gemini: Render живёт в США, VPN ему не нужен. Ключ
      # вводится в панели один раз, как и BOT_TOKEN.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Жизненный цикл заказа: адрес выдачи уходит покупателю в сообщении,
      # порог автоотмены — час под ручную сверку перевода (вебхук платёжки
      # позволит 10-15). Вводятся в панели, у витрины своих значений нет.
      - key: PICKUP_ADDRESS
        sync: false
      - key: PICKUP_HOURS
        sync: false
      - key: UNPAID_TTL_MINUTES
        value: "60"
      # WEBAPP_URL не задаём: адрес придёт из RENDER_EXTERNAL_URL, который
      # платформа подставляет сама — дублировать домен руками незачем.
