<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Watch Demo — панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<style>
/* Цвета те же, что у витрины: темы Telegram, а в обычном браузере — свои
   значения для светлой и тёмной системы. Панель открывают и там, и там. */
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #0f1419);
  --hint: var(--tg-theme-hint-color, #6b7178);
  --link: var(--tg-theme-link-color, #2481cc);
  --button: var(--tg-theme-button-color, #2481cc);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
  --separator: var(--tg-theme-section-separator-color, rgba(128, 128, 128, .2));
  --destructive: var(--tg-theme-destructive-text-color, #df3f40);
  --ok: #2e9e63; --warn: #c7811c;
  --radius: 12px; --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--tg-theme-bg-color, #17191c);
    --text: var(--tg-theme-text-color, #eceef0);
    --hint: var(--tg-theme-hint-color, #8d939a);
    --link: var(--tg-theme-link-color, #5aa7e8);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #202327);
    --ok: #4fbf84; --warn: #e0a547;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
[v-cloak] { display: none; }
.num { font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--separator); background: var(--secondary-bg); border-radius: 10px;
  padding: 9px 14px; min-height: 40px; cursor: pointer; transition: opacity .15s var(--ease); }
.btn:hover { opacity: .85; }
.btn.primary { background: var(--button); color: var(--button-text); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--destructive); }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; color: var(--link); cursor: pointer; padding: 6px 4px; }

.login { max-width: 380px; margin: 14vh auto 0; padding: 0 16px; text-align: center; }
.login h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 8px; }
.login p { color: var(--hint); margin: 0 0 28px; }
.err { color: var(--destructive); font-size: 14px; min-height: 20px; margin: 10px 0; }

.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--separator); }
.top b { font-size: 16px; }
.top .who { margin-left: auto; color: var(--hint); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 480px); height: calc(100vh - 57px); }
.list { overflow: auto; border-right: 1px solid var(--separator); }
.bar { position: sticky; top: 0; background: var(--bg); padding: 14px 20px 10px; z-index: 1; display: grid; gap: 10px; }
.search { width: 100%; border: 1px solid var(--separator); background: var(--secondary-bg); border-radius: 10px; padding: 9px 12px; min-height: 40px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tab { white-space: nowrap; border: 0; background: var(--secondary-bg); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--hint); }
.tab.on { background: var(--button); color: var(--button-text); }
.tab .n { margin-left: 4px; opacity: .75; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--hint); padding: 8px 10px; border-bottom: 1px solid var(--separator); }
td { padding: 11px 10px; border-bottom: 1px solid var(--separator); vertical-align: top; }
th:first-child, td:first-child { padding-left: 20px; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--secondary-bg); }
tr.row.sel { background: var(--secondary-bg); box-shadow: inset 3px 0 0 var(--button); }
.dim { color: var(--hint); font-size: 13px; }
.badge { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--secondary-bg); }
.st-new, .st-awaiting_payment { color: var(--warn); }
.st-paid, .st-assembled, .st-shipped, .st-ready_for_pickup { color: var(--link); }
.st-delivered { color: var(--ok); }
.st-cancelled { color: var(--hint); }
.empty { padding: 40px 20px; color: var(--hint); }

.card { overflow: auto; padding: 20px; }
.card h2 { font-size: 24px; letter-spacing: -.02em; margin: 4px 0 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card h3 { font-size: 13px; color: var(--hint); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--hint); } .kv dd { margin: 0; word-break: break-word; }
.items { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.items li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--separator); }
.total { display: flex; justify-content: space-between; font-weight: 600; padding-top: 10px; }
.hist { list-style: none; padding: 0; margin: 0; font-size: 14px; display: grid; gap: 6px; }
.hist .warn { color: var(--destructive); font-size: 12px; }
.actions { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 6px; display: grid; gap: 10px; border-top: 1px solid var(--separator); margin-top: 20px; }
.actions .row { display: flex; gap: 8px; flex-wrap: wrap; }
.note-in { width: 100%; border: 1px solid var(--separator); background: var(--secondary-bg); border-radius: 10px; padding: 9px 12px; min-height: 40px; }
.placeholder { padding: 40px 20px; color: var(--hint); }
.back { display: none; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); }

.views { display: flex; gap: 4px; }
.views .tab { font-size: 14px; }
.cat { max-width: 1100px; }
.cat td { vertical-align: middle; padding-top: 6px; padding-bottom: 6px; }
.cat tr.off td:not(:last-child) { opacity: .5; }
.cell { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; min-height: 36px; }
.cell:hover { border-color: var(--separator); }
.cell:focus { border-color: var(--link); background: var(--secondary-bg); outline: none; }
.cell.n { text-align: right; max-width: 110px; margin-left: auto; display: block; }
.cat th.r { text-align: right; padding-right: 18px; }
select.cell { cursor: pointer; }
.pic { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--secondary-bg); display: block; }
.newrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.newrow .search { flex: 1 1 180px; width: auto; }
.newrow .short { flex: 0 1 120px; }
.switch { width: 20px; height: 20px; accent-color: var(--button); cursor: pointer; }
.foot { padding: 0 20px 20px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .list { border-right: 0; }
  .card { position: fixed; inset: 0; background: var(--bg); z-index: 5; padding: 16px; }
  .back { display: inline-block; }
  .hide-m { display: none; }
  .bar, .top { padding-left: 16px; padding-right: 16px; }
  th:first-child, td:first-child { padding-left: 16px; }
  .placeholder { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div v-if="state === 'loading'"></div>

  <div v-else-if="state === 'login'" class="login">
    <h1>Заказы Watch Demo</h1>
    <p>Панель для админов магазина. Вход подтверждается в Telegram — пароля нет.</p>
    <button class="btn primary" @click="startLogin" :disabled="waiting">
      {{ waiting ? 'Ждём подтверждения в боте…' : 'Войти через Telegram' }}</button>
    <div v-if="loginLink"><a class="link" :href="loginLink" target="_blank" rel="noopener">Открыть бота ещё раз</a></div>
    <div class="err">{{ error }}</div>
  </div>

  <template v-else>
    <header class="top">
      <b>Watch Demo</b>
      <nav class="views" aria-label="Раздел">
        <button class="tab" :class="{on: view === 'orders'}" @click="view = 'orders'">Заказы</button>
        <button class="tab" :class="{on: view === 'catalog'}" @click="openCatalog">Каталог</button>
      </nav>
      <span class="who">{{ me.name }}</span>
      <button class="link" @click="logout" v-if="!inTelegram">Выйти</button>
    </header>

    <div class="layout" v-if="view === 'orders'">
      <section class="list">
        <div class="bar">
          <input class="search" v-model="query" @input="debouncedLoad" placeholder="Номер, имя или телефон" aria-label="Поиск заказа">
          <nav class="tabs" aria-label="Статус">
            <button class="tab" :class="{on: !filter}" @click="setFilter('')">Все<span class="n num">{{ total }}</span></button>
            <button v-for="s in statuses" :key="s.code" class="tab" :class="{on: filter === s.code}"
                    v-show="counts[s.code]" @click="setFilter(s.code)">
              {{ s.title }}<span class="n num">{{ counts[s.code] }}</span></button>
          </nav>
        </div>
        <table v-if="orders.length">
          <thead><tr><th>№</th><th>Покупатель</th><th class="hide-m">Сумма</th><th>Статус</th></tr></thead>
          <tbody>
            <tr v-for="o in orders" :key="o.id" class="row" :class="{sel: card && card.id === o.id}"
                tabindex="0" @click="open(o.id)" @keydown.enter="open(o.id)">
              <td class="num">{{ o.id }}</td>
              <td>{{ o.contact_name }}<div class="dim num">{{ o.contact_phone }} · {{ when(o.created_at) }}</div></td>
              <td class="num hide-m">{{ o.total_text }}</td>
              <td><span class="badge" :class="'st-' + o.status">{{ o.status_text }}</span></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">{{ query ? 'Ничего не нашлось' : 'Заказов пока нет' }}</div>
      </section>

      <aside class="card" v-if="card">
        <button class="link back" @click="card = null">← К списку</button>
        <h2>Заказ №{{ card.id }} <span class="badge" :class="'st-' + card.status">{{ card.status_text }}</span></h2>

        <dl class="kv">
          <dt>Покупатель</dt><dd>{{ card.contact_name }}</dd>
          <dt>Телефон</dt><dd class="num"><a class="link" :href="'tel:' + card.contact_phone">{{ card.contact_phone }}</a></dd>
          <dt>Получение</dt><dd>{{ card.delivery_title }}</dd>
          <dt v-if="card.address">Адрес</dt><dd v-if="card.address">{{ card.address }}</dd>
          <dt v-if="card.comment">Комментарий</dt><dd v-if="card.comment">{{ card.comment }}</dd>
          <dt>Оформлен</dt><dd class="num">{{ when(card.created_at) }}</dd>
        </dl>

        <h3>Состав</h3>
        <ul class="items">
          <li v-for="i in card.items"><span>{{ i.title }} × {{ i.qty }}</span><span class="num">{{ i.sum_text }}</span></li>
          <li v-if="card.discount"><span>Скидка {{ card.promo_code }}</span><span class="num">−{{ card.discount_text }}</span></li>
          <li><span>Доставка</span><span class="num">{{ card.delivery_cost_text }}</span></li>
        </ul>
        <div class="total"><span>Итого</span><span class="num">{{ card.total_text }}</span></div>

        <h3>История</h3>
        <ul class="hist">
          <li v-for="h in card.history">
            <span class="dim num">{{ when(h.created_at) }}</span> · {{ h.status_text }}
            <span class="dim">({{ actorTitle[h.actor] || h.actor }})</span><span v-if="h.note"> — {{ h.note }}</span>
          </li>
        </ul>

        <div class="actions" v-if="card.actions.length">
          <template v-if="pending">
            <label class="dim" for="note">{{ pending.note_label }}</label>
            <input id="note" class="note-in" v-model="note" maxlength="200" @keydown.enter="run(pending)" ref="noteInput">
            <div class="row">
              <button class="btn primary" :disabled="busy || !note.trim()" @click="run(pending)">{{ pending.title }}</button>
              <button class="btn" @click="pending = null; note = ''">Назад</button>
            </div>
          </template>
          <div class="row" v-else>
            <button v-for="a in card.actions" :key="a.to" class="btn" :class="a.to === 'cancelled' ? 'danger' : 'primary'"
                    :disabled="busy" @click="ask(a)">{{ a.to === 'cancelled' ? 'Отменить' : a.title }}</button>
          </div>
          <div class="err">{{ error }}</div>
        </div>
      </aside>
      <div v-else class="placeholder">Выберите заказ слева</div>
    </div>

    <section class="list cat" v-else>
      <div class="bar">
        <div class="newrow">
          <input class="search" v-model="catQuery" placeholder="Найти товар" aria-label="Поиск товара">
          <button class="btn" @click="adding = !adding">{{ adding ? 'Отмена' : '+ Товар' }}</button>
        </div>
        <form class="newrow" v-if="adding" @submit.prevent="createProduct">
          <input class="search" v-model="draft.title" placeholder="Название" maxlength="128" required>
          <select class="search short" v-model.number="draft.category_id" aria-label="Категория">
            <option v-for="c in categories" :key="c.id" :value="c.id">{{ c.title }}</option>
          </select>
          <input class="search short num" v-model="draft.price" inputmode="numeric" placeholder="Цена" required>
          <input class="search short num" v-model="draft.stock" inputmode="numeric" placeholder="Остаток, ∞">
          <button class="btn primary" :disabled="busy">Добавить</button>
        </form>
        <nav class="tabs" aria-label="Категория">
          <button class="tab" :class="{on: !catFilter}" @click="catFilter = 0">Все<span class="n num">{{ products.length }}</span></button>
          <button v-for="c in categories" :key="c.id" class="tab" :class="{on: catFilter === c.id}"
                  @click="catFilter = c.id">{{ c.title }}<span class="n num">{{ countIn(c.id) }}</span></button>
        </nav>
      </div>
      <table v-if="shownProducts.length">
        <thead><tr><th class="hide-m"></th><th title="Номер для /photo в боте">№</th><th>Название</th><th class="hide-m">Категория</th>
          <th class="r">Цена</th><th class="r">Остаток</th><th title="Показывать на витрине">Витрина</th></tr></thead>
        <tbody>
          <tr v-for="p in shownProducts" :key="p.id" :class="{off: !p.is_active}">
            <td class="hide-m"><img v-if="p.image" class="pic" :src="p.image" alt="" loading="lazy"><div v-else class="pic"></div></td>
            <td class="dim num">{{ p.id }}</td>
            <td><input class="cell" :value="p.title" maxlength="128" aria-label="Название"
                       @change="save(p, 'title', $event.target.value, $event)"></td>
            <td class="hide-m"><select class="cell" :value="p.category_id" aria-label="Категория"
                       @change="save(p, 'category_id', +$event.target.value, $event)">
              <option v-for="c in categories" :key="c.id" :value="c.id">{{ c.title }}</option></select></td>
            <td><input class="cell n num" :value="p.price" inputmode="numeric" aria-label="Цена"
                       @change="save(p, 'price', toInt($event.target.value), $event)"></td>
            <td><input class="cell n num" :value="p.stock < 0 ? '' : p.stock" placeholder="∞" inputmode="numeric"
                       aria-label="Остаток, пусто — без учёта"
                       @change="save(p, 'stock', $event.target.value.trim() === '' ? -1 : toInt($event.target.value), $event)"></td>
            <td><input type="checkbox" class="switch" :checked="p.is_active" aria-label="На витрине"
                       @change="save(p, 'is_active', $event.target.checked, $event)"></td>
          </tr>
        </tbody>
      </table>
      <div v-else class="empty">{{ catQuery ? 'Ничего не нашлось' : 'Товаров пока нет' }}</div>
      <p class="dim foot">Фото — в боте: снимок с подписью /photo и номер товара (картинки хранит Telegram).
        Пустой остаток — товар без учёта склада.</p>
    </section>
  </template>
  <div class="toast" v-if="toast" role="status">{{ toast }}</div>
</div>

<script>
const TG = window.Telegram && Telegram.WebApp;
const KEY = "wd_admin_session";
// sessionStorage, а не localStorage: токен админа живёт до закрытия вкладки,
// а не сутки на любом компьютере, где однажды открыли панель.
const stored = () => { try { return sessionStorage.getItem(KEY) || ""; } catch { return ""; } };
const store = (t) => { try { t ? sessionStorage.setItem(KEY, t) : sessionStorage.removeItem(KEY); } catch {} };

Vue.createApp({
  data: () => ({
    state: "loading", me: {}, error: "", toast: "", waiting: false, loginLink: "",
    orders: [], counts: {}, statuses: [], filter: "", query: "", card: null,
    pending: null, note: "", busy: false, token: stored(),
    inTelegram: !!(TG && TG.initData),
    view: "orders", products: [], categories: [], catFilter: 0, catQuery: "", adding: false,
    draft: { title: "", category_id: null, price: "", stock: "" },
    actorTitle: { admin: "админ", customer: "покупатель", system: "автоматически" },
  }),
  computed: {
    total() { return Object.values(this.counts).reduce((a, b) => a + b, 0); },
    shownProducts() {
      const q = this.catQuery.trim().toLowerCase();
      return this.products.filter(p => (!this.catFilter || p.category_id === this.catFilter)
        && (!q || p.title.toLowerCase().includes(q)));
    },
  },
  async mounted() {
    // Таблица заказов в половине экрана нечитаема — раскрываем сразу.
    if (TG) { TG.ready(); TG.expand(); }
    await this.enter();
    // Новые заказы подтягиваем сами — админ не должен жать F5.
    setInterval(() => this.state === "ready" && this.view === "orders" && !this.busy && this.load(), 15000);
  },
  methods: {
    auth() {
      if (this.inTelegram) return "tma " + TG.initData;
      return this.token ? "tma-session " + this.token : "";
    },
    async api(path, opts = {}) {
      const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: this.auth() },
                                    body: opts.body ? JSON.stringify(opts.body) : undefined });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        let msg = data.detail;
        if (Array.isArray(msg)) msg = msg.map(e => e.msg).join("; ");
        throw Object.assign(new Error(msg || "Ошибка " + r.status), { status: r.status });
      }
      return data;
    },
    async enter() {
      if (!this.auth()) { this.state = "login"; return; }
      try {
        this.me = await this.api("/api/admin/me");
        this.state = "ready";
        await this.load();
      } catch (e) {
        if (!this.inTelegram) { store(""); this.token = ""; }
        this.state = "login";
        this.error = e.status === 403 ? e.message : (e.status === 401 ? "" : e.message);
      }
    },
    async startLogin() {
      this.error = "";
      try {
        const { code, link } = await this.api("/api/auth/start", { method: "POST" });
        this.loginLink = link;
        window.open(link, "_blank", "noopener");
        this.waiting = true;
        for (let i = 0; i < 150 && this.waiting; i++) {  // ~5 минут, как живёт код
          await new Promise(r => setTimeout(r, 2000));
          const r = await fetch("/api/auth/poll?code=" + encodeURIComponent(code));
          if (r.status === 404) break;
          const d = await r.json();
          if (d.ready) { this.token = d.token; store(d.token); this.waiting = false; return this.enter(); }
        }
        this.error = "Код входа устарел, нажмите ещё раз";
      } catch (e) { this.error = e.message; }
      this.waiting = false;
    },
    logout() { store(""); this.token = ""; this.card = null; this.state = "login"; },
    async load() {
      const p = new URLSearchParams();
      if (this.filter) p.set("status", this.filter);
      if (this.query.trim()) p.set("q", this.query.trim());
      try {
        const d = await this.api("/api/admin/orders?" + p);
        this.orders = d.orders; this.counts = d.counts; this.statuses = d.statuses;
      } catch (e) { if (e.status === 401) this.logout(); }
    },
    debouncedLoad() { clearTimeout(this._d); this._d = setTimeout(() => this.load(), 300); },
    setFilter(f) { this.filter = f; this.load(); },
    async open(id) {
      this.pending = null; this.note = ""; this.error = "";
      try { this.card = await this.api("/api/admin/orders/" + id); } catch (e) { this.flash(e.message); }
    },
    ask(a) {
      if (a.note) { this.pending = a; this.note = ""; this.$nextTick(() => this.$refs.noteInput && this.$refs.noteInput.focus()); }
      else this.run(a);
    },
    async run(a) {
      if (a.note && !this.note.trim()) return;
      this.busy = true; this.error = "";
      try {
        const c = await this.api(`/api/admin/orders/${this.card.id}/transition`, { method: "POST",
          body: { from_status: this.card.status, to_status: a.to, note: this.note } });
        this.card = c; this.pending = null; this.note = "";
        this.flash(c.notified ? "Готово, покупатель уведомлён" : "Готово, но покупатель НЕ уведомлён — свяжитесь сами");
        await this.load();
      } catch (e) {
        this.error = e.message;
        // 409: заказ уже сменили в боте или в соседней вкладке — показать как есть.
        if (e.status === 409) { await this.open(this.card.id); this.error = e.message; await this.load(); }
      } finally { this.busy = false; }
    },
    async openCatalog() {
      this.view = "catalog";
      try {
        const d = await this.api("/api/admin/products");
        this.products = d.products; this.categories = d.categories;
        if (!this.draft.category_id && d.categories.length) this.draft.category_id = d.categories[0].id;
      } catch (e) { if (e.status === 401) this.logout(); else this.flash(e.message); }
    },
    countIn(id) { return this.products.filter(p => p.category_id === id).length; },
    // Пробелы-разделители тысяч убираем (\s в JS ловит и неразрывный), а "12.5",
    // "12k", "-3" — не число. NaN не отправляем: сервер ответил бы непонятным
    // "Input should be a valid integer".
    toInt(s) { const v = String(s).replace(/\s/g, ""); return /^\d+$/.test(v) ? Number(v) : NaN; },
    async save(p, field, value, ev) {
      if (value === p[field]) return;
      const revert = () => {
        // Поле откатываем к тому, что лежит в базе: иначе на экране осталась бы
        // цена, которой у товара нет.
        if (!ev || !ev.target) return;
        if (ev.target.type === "checkbox") ev.target.checked = p[field];
        else ev.target.value = field === "stock" && p.stock < 0 ? "" : p[field];
      };
      if (Number.isNaN(value)) { revert(); this.flash("Нужно целое число"); return; }
      try {
        const fresh = await this.api("/api/admin/products/" + p.id, { method: "PATCH", body: { [field]: value } });
        Object.assign(p, fresh);
        this.flash("Сохранено");
      } catch (e) {
        if (e.status === 401) return this.logout();
        revert();
        this.flash(e.message);
      }
    },
    async createProduct() {
      const price = this.toInt(this.draft.price);
      const stock = String(this.draft.stock).trim() === "" ? -1 : this.toInt(this.draft.stock);
      if (Number.isNaN(price) || Number.isNaN(stock)) { this.flash("Цена и остаток — целые числа"); return; }
      this.busy = true;
      try {
        const p = await this.api("/api/admin/products", { method: "POST",
          body: { title: this.draft.title, category_id: this.draft.category_id, price, stock } });
        this.products.push(p);
        this.draft = { title: "", category_id: this.draft.category_id, price: "", stock: "" };
        this.adding = false;
        this.flash(`Товар №${p.id} добавлен. Фото — боту с подписью /photo ${p.id}`);
      } catch (e) { this.flash(e.message); }
      finally { this.busy = false; }
    },
    flash(m) { this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => this.toast = "", 3000); },
    when(iso) { return new Date(iso).toLocaleString("ru", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); },
  },
}).mount("#app");
</script>
</body>
</html>
